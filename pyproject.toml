[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-c-lab"
version = "0.1.0"
description = "Example environments and planners for leap-c"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "leap-c",
  "casadi",
  "gymnasium==1.1.1",
  "matplotlib",
  "numpy>=1.26.0",
  "scipy==1.15.2",
  "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.0",
  "ruff==0.12.12",
]

[tool.setuptools.packages.find]
include = ["leapc_lab*"]

[tool.pytest.ini_options]
testpaths = "tests"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
ignore = [
  "E741",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
]
extend-select = ["D", "I", "NPY", "UP045", "E501"]
