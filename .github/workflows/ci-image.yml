name: ci-image

on:
  push:
    branches: [main]
    paths:
      - docker/ci/Dockerfile
      - pyproject.toml
      - .github/workflows/ci-image.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leap-c/leap-c-lab-ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubuntu24.04
          cache-from: type=gha,scope=leap-c-lab-ci-amd64
          cache-to: type=gha,scope=leap-c-lab-ci-amd64,mode=max

      - name: Smoke test image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -lc 'for py in 3.11 3.12 3.13; do \
              VIRTUAL_ENV=/opt/venvs/$py /opt/venvs/$py/bin/python -c \
              "import torch, casadi, gymnasium, numpy, scipy; print(\"$py ok\")"; \
            done'
