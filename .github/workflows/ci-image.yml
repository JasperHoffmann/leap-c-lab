name: ci-image

on:
  push:
    branches: [main]
    paths:
      - docker/ci/Dockerfile
      - pyproject.toml
      - .github/workflows/ci-image.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leap-c/leap-c-lab-ci

jobs:
  build:
    name: build py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ci/Dockerfile
          platforms: linux/amd64
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${{ matrix.python-version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${{ matrix.python-version }}-ubuntu24.04
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${{ matrix.python-version }}-sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=leap-c-lab-ci-py${{ matrix.python-version }}-amd64
          cache-to: type=gha,scope=leap-c-lab-ci-py${{ matrix.python-version }}-amd64,mode=max

      - name: Smoke test image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${{ matrix.python-version }} \
            python -c "import torch, acados_template, casadi, gymnasium, numpy, scipy; print('py${{ matrix.python-version }} ok')"
