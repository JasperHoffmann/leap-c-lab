name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      leap_c_ref:
        description: leap-c ref to install
        required: false
        default: main
  repository_dispatch:
    types: [leap-c-updated, downstream-ci]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check linting violations
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "check --config pyproject.toml --output-format=github ."
      - name: Check formatting violations
        run: ruff format --diff --config pyproject.toml .

  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/leap-c/leap-c-lab-ci:py${{ matrix.python-version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      LEAP_C_REF: ${{ github.event.client_payload.leap_c_ref || github.event.inputs.leap_c_ref || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate Python ${{ matrix.python-version }}
        run: |
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=/opt/venv" >> "$GITHUB_ENV"

      - name: Install leap-c and repo
        run: |
          uv pip install "git+https://github.com/leap-c/leap-c.git@${LEAP_C_REF}"
          uv pip install -e ".[dev]"

      - name: Tests
        run: pytest tests/leapc_lab -v
