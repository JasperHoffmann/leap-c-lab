name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      leap_c_ref:
        description: leap-c ref to install
        required: false
        default: main
  repository_dispatch:
    types: [leap-c-updated, downstream-ci]

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container: ghcr.io/leap-c/acados-ci:ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      LEAP_C_REF: ${{ github.event.client_payload.leap_c_ref || github.event.inputs.leap_c_ref || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          uv pip install /opt/acados/interfaces/acados_template
          uv pip install "git+https://github.com/leap-c/leap-c.git@${LEAP_C_REF}"
          uv pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check --config pyproject.toml .
          ruff format --diff .

      - name: Compile
        run: python -m compileall leapc_lab tests

      - name: Tests
        run: pytest tests/leapc_lab -v
